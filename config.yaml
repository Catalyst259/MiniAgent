# MiniAgent configuration
models:
  main:
    provider: openai_compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-chat
    temperature: 0.2
    max_tokens: 8192
    trust_env: false        # ignore ambient HTTP(S)_PROXY vars for this endpoint
  fast:
    provider: openai_compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-chat
    temperature: 0.0
    max_tokens: 4096
    trust_env: false

default_model: main
context:
  max_input_tokens: 128000
  reserve_output_tokens: 8192
  compact_trigger_ratio: 0.8
  keep_recent_messages: 8
runtime:
  max_iterations: 40
  max_repeated_tool_calls: 3
  tool_timeout_seconds: 120
  workspace_root: .
tools:
  enabled: [list_dir, glob, grep, read_file, write_file, apply_patch, shell, git_diff]
  max_output_chars: 30000
memory:
  enabled: true
  backend: qdrant_local   # qdrant_local | memory
  path: .miniagent/memory
  collection: miniagent_memory
  top_k: 5
  score_threshold: 0.05   # hashing embeddings score low; raise (0.3+) for real embedding models
embedding:
  backend: hashing        # hashing | openai_compatible | sentence_transformers
  dimensions: 256
  base_url: null
  api_key_env: EMBEDDING_API_KEY
  model: null
skills:
  paths: [skills]
subagents:
  paths: [subagents]
permissions:
  # off  = no permission layer (historical behaviour)
  # ask  = prompt for anything the rules do not cover
  # auto = deny anything the rules do not cover (non-interactive runs)
  mode: auto
  default: ask
  # Rules are most-restrictive-wins: a broad allow cannot hide a narrow ask.
  rules:
    # --- reading and inspecting the workspace is always fine -------------
    - tool: list_dir
      permission: allow
    - tool: glob
      permission: allow
    - tool: grep
      permission: allow
    - tool: read_file
      permission: allow
    - tool: git_diff
      permission: allow
    - tool: load_skill
      permission: allow
    # Delegation is safe by construction: a subagent is clamped to the
    # read-only tool ceiling and cannot ask for anything itself.
    - tool: delegate
      permission: allow
    - tool: request_user_input
      permission: allow
    # --- changing the workspace needs consent ---------------------------
    - tool: write_file
      permission: ask
    - tool: apply_patch
      permission: ask
    # --- git is allowed to look, asked to change ------------------------
    - tool: shell
      prefix: git status
      permission: allow
    - tool: shell
      prefix: git diff
      permission: allow
    - tool: shell
      prefix: git log
      permission: allow
    - tool: shell
      prefix: ls
      permission: allow
    # --- everything else on the shell needs consent ---------------------
    - tool: shell
      permission: ask
    # --- never has a legitimate reason to reach a shell -----------------
    - tool: shell
      program: rm
      permission: deny
    - tool: shell
      program: sudo
      permission: deny
    - tool: shell
      program: shutdown
      permission: deny
    - tool: shell
      program: mkfs
      permission: deny
    - tool: shell
      program: dd
      permission: deny
    # --- optional safety net for tools nobody enumerated above -----------
    # Every action carries a risk level (low/medium/high; an unknown tool is
    # medium, not "harmless"). A risk band applies only where no ordinary rule is
    # *more* restrictive, and a risk `deny` is a hard floor over all of them.
    #
    # Uncomment to make any un-enumerated medium-or-worse action ask. Note that
    # `shell` is high risk, so this also makes every shell command that the rules
    # above do not explicitly allow ask - which is usually what you want in
    # `mode: ask`, and redundant in `mode: auto`.
    #
    # - risk: medium
    #   permission: ask
  # denied outright, in every mode and for every approval scope
  protected_paths:
    - ".env"
    - "**/.env"
    - "**/*.pem"
    - "**/*.key"
    - "**/id_rsa*"
    - "**/.ssh/**"
    - "**/.aws/**"
  # "Always allow" grants live outside the workspace: the agent can write
  # inside the workspace and must not be able to edit its own permission store.
  persistent: false
  persistent_path: null
checkpoint:
  path: .miniagent/checkpoints.sqlite
logging:
  level: INFO
  file: null
