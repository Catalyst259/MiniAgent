[project]
name = "miniagent"
version = "0.1.0"
description = "Lightweight terminal MiniAgent: LangGraph orchestration + OpenAI-compatible ModelGateway + MCP tools + Filesystem skills + Qdrant memory"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "langgraph>=0.2.40",
    "langgraph-checkpoint-sqlite>=2.0",
    "mcp>=1.2",
    "qdrant-client>=1.11",
    "structlog>=24.1",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
miniagent = "harness.cli.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
